name: Backend CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: src

jobs:
  ci:
    name: Backend Continuous Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: ci_test_jwt_secret_that_is_long_enough
      JWT_EXPIRES_IN: 1h
      COOKIE_NAME: weekly_report_token
      ADMIN_REGISTRATION_SECRET: ci_admin_setup_secret
      MONGODB_URI: mongodb://127.0.0.1:27017/weekly_report_ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/package-lock.json

      - name: Display Environment Information
        run: |
          node --version
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Check JavaScript Syntax
        run: find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} +

      - name: Validate Express App Module Import
        run: node --input-type=module -e "import('./app.js').then(() => console.log('App module import check passed.'));"

      - name: Run Backend Tests
        run: npm test -- --passWithNoTests
